name: Auction Service CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - prod
    paths:
      - 'auction-service/**'
      - '.github/workflows/auction-service-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    defaults:
      run:
        working-directory: auction-service 

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -DskipTests

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: build
    defaults:
      run:
        working-directory: auction-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auction-unit-test-results 
          path: auction-service/target/surefire-reports/