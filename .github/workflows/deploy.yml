name: Production Deployment

on:
  push:
    branches:
      - prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase github repository owner name for image tagging (GHCR requires lowercase names)
      - name: Set lower case owner name
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # Set up JDK 21 for Maven cache and verification (to build images faster)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Build and Push Discovery Service
      - name: Build & Push Discovery Service
        uses: docker/build-push-action@v5
        with:
          context: ./discovery-service
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/bidly-discovery-service:latest

      # Build and Push Gateway Service
      - name: Build & Push Gateway Service
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-service
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/bidly-gateway-service:latest

      # Build and Push Auth Service
      - name: Build & Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/bidly-auth-service:latest

      # Build and Push Auction Service
      - name: Build & Push Auction Service
        uses: docker/build-push-action@v5
        with:
          context: ./auction-service
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/bidly-auction-service:latest

      # Build and Push Notification Service
      - name: Build & Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/bidly-notification-service:latest

      # Build and Push Frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/bidly-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Transfer compose and caddy configurations to VPS
      - name: Copy config files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: "~/bidly-deploy"

      # Execute deployment commands on VPS
      - name: SSH into VPS and run services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ~/bidly-deploy
            cd ~/bidly-deploy
            
            # Lowercase repo owner for image resolution
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            
            # Write environment variables
            echo "GH_OWNER=${REPO_OWNER}" > .env
            echo "DOMAIN=${{ secrets.DOMAIN }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}" >> .env
            echo "RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}" >> .env
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
            echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env

            # Authenticate with GHCR using a Personal Access Token (PAT)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull down the latest built images from GHCR
            docker compose -f docker-compose.prod.yml pull
            
            # Restart modified containers
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Clean up old unused images
            docker image prune -f
