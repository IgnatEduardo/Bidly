name: Auth Service CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - prod
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    defaults:
      run:
        working-directory: auth-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -DskipTests

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: build
    defaults:
      run:
        working-directory: auth-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test -Dtest='*Test,!*IntegrationTest'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-unit-test-results
          path: auth-service/target/surefire-reports/

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: build
    defaults:
      run:
        working-directory: auth-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: mvn test -Dtest='*IntegrationTest' -Dspring.profiles.active=test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-integration-test-results
          path: auth-service/target/surefire-reports/

