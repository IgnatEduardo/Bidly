server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        # auth service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

logging:
  level:
    io.netty.resolver.dns.macos.MacOSDnsServerAddressStreamProviders: OFF

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  security:
    enabled: false
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}


