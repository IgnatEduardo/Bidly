server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # auth service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        # auction service
        - id: auction-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auctions/**

        # auction websocket
        - id: auction-websocket
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**

logging:
  level:
    io.netty.resolver.dns.macos.MacOSDnsServerAddressStreamProviders: OFF


